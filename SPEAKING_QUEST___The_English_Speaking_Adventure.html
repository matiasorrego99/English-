  <style>
    /* Estilos base y microanimaciones de videojuego RPG */
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #070B19;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(59, 130, 246, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(139, 92, 246, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(20, 184, 166, 0.11) 0%, transparent 50%);
      color: #F1F5F9;
      overflow-x: hidden;
      min-height: 100vh;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float {
      animation: floatSlow 3.4s ease-in-out infinite;
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.28s ease-out forwards;
    }

    .rpg-panel {
      background: linear-gradient(155deg, rgba(19, 29, 62, 0.92) 0%, rgba(13, 20, 43, 0.96) 100%);
      border: 1px solid rgba(56, 189, 248, 0.18);
      backdrop-filter: blur(10px);
    }

    .rpg-card-interactive {
      background: linear-gradient(160deg, rgba(19, 29, 62, 0.88) 0%, rgba(11, 17, 36, 0.96) 100%);
      border: 1px solid rgba(148, 163, 184, 0.16);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .rpg-card-interactive:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.52);
      box-shadow: 0 12px 28px -8px rgba(59, 130, 246, 0.25);
    }

    /* Cartas de memoria 3D */
    .memory-card-inner {
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .memory-card.flipped .memory-card-inner {
      transform: rotateY(180deg);
    }

    .memory-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .memory-back {
      transform: rotateY(180deg);
    }

    /* Scrollbar sutil */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E2E58;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3B82F6;
    }
  </style>
</head>

    /* =========================================================================
       1. SISTEMA DE SONIDO SUAVE (WEB AUDIO API SIN ARCHIVOS EXTERNOS)
       ========================================================================= */
    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;

      function ensureContext() {
        if (!enabled) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            ctx = new AudioCtx();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playTone(freq, duration, type = 'sine', delay = 0, gainPeak = 0.08) {
        const audio = ensureContext();
        if (!audio) return;
        try {
          const now = audio.currentTime + delay;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(gainPeak, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (err) {
          // Ignorar errores de audio en navegadores restringidos
        }
      }

      return {
        setEnabled(val) {
          enabled = Boolean(val);
        },
        isEnabled() {
          return enabled;
        },
        click() {
          playTone(520, 0.07, 'triangle', 0, 0.05);
        },
        correct() {
          playTone(587.33, 0.12, 'triangle', 0, 0.08);
          playTone(880, 0.18, 'triangle', 0.09, 0.09);
        },
        wrong() {
          playTone(260, 0.14, 'sawtooth', 0, 0.05);
          playTone(195, 0.18, 'sawtooth', 0.11, 0.05);
        },
        fanfare() {
          playTone(523.25, 0.13, 'triangle', 0, 0.08);
          playTone(659.25, 0.13, 'triangle', 0.11, 0.08);
          playTone(783.99, 0.15, 'triangle', 0.22, 0.09);
          playTone(1046.5, 0.28, 'triangle', 0.34, 0.1);
        }
      };
    })();

    function getDefaultState() {
      return {
        playerName: 'English Learner',
        level: 'Beginner A1',
        xp: 0,
        stars: 0,
        coins: 0,
        completedActivities: {}, // clave: `${worldId}:${activityId}` -> true
        badges: [],
        examHistory: [],
        activeView: 'home', // 'home' | 'map' | 'practice' | 'progress' | 'world'
        activeWorldId: 'world1',
        activeStep: 'LEARN'
      };
    }

    let state = loadState();

    // Estado efímero de UI / juegos activos (no rompe navegación)
    const runtimeUI = {
      questyMood: '¡Hola! Soy QUESTY, tu guía en SPEAKING QUEST. ¡Vamos paso a paso para preparar tu examen oral A1!',
      flashcardIndex: 0,
      flashcardRevealed: false,
      pastFlashIndex: 0,
      pastFlashRevealed: false,
      matchSelectedEn: null,
      matchSelectedEs: null,
      matchMatchedIds: [],
      pastMatchSelectedBase: null,
      pastMatchSelectedPast: null,
      pastMatchPairs: [],
      memoryCards: [],
      memoryFlipped: [],
      memoryMatched: [],
      quizQuestions: [],
      quizIndex: 0,
      quizScore: 0,
      quizAnswered: false,
      quizSelectedOption: null,
      orderCurrent: [],
      orderIndex: 0,
      speakingIndex: 0,
      speakingPool: [...ALL_SPEAKING_QUESTIONS],
      speakingTimer: 10,
      speakingTimerRunning: false,
      speakingShowAnswer: false,
      speakingRandomMode: false,
      examQuestions: [],
      examIndex: 0,
      examPhase: 'intro', // 'intro' | 'question' | 'report'
      examTimer: 10,
      examTimerActive: false,
      examSpeakingStarted: false,
      examShowModel: false,
      examLogs: []
    };

    let speakingIntervalId = null;
    let examIntervalId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return {
          ...getDefaultState(),
          ...parsed,
          completedActivities: parsed.completedActivities && typeof parsed.completedActivities === 'object' ? parsed.completedActivities : {},
          badges: Array.isArray(parsed.badges) ? parsed.badges : [],
          examHistory: Array.isArray(parsed.examHistory) ? parsed.examHistory : []
        };
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Si localStorage no está disponible, continuar en memoria
      }
    }

    // Total de hitos/actividades para calcular el porcentaje de progreso (0% a 100%)
    const TOTAL_MILESTONES = 16;

    function computeProgressPercent() {
      const doneCount = Object.keys(state.completedActivities).length;
      const pct = Math.min(100, Math.round((doneCount / TOTAL_MILESTONES) * 100));
      return pct;
    }

    function showToast(title, subtitle, accentClass = 'border-sky-400/50 text-sky-200') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = `pointer-events-auto animate-fade-up rounded-2xl bg-[#0E1733]/95 border ${accentClass} px-4 py-3 shadow-xl backdrop-blur-md`;
      el.innerHTML = `
        <div class="font-display font-bold text-sm text-white">${escapeHtml(title)}</div>
        <div class="text-xs text-slate-300 mt-0.5">${escapeHtml(subtitle)}</div>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    function checkAndUnlockBadges() {
      const doneKeys = Object.keys(state.completedActivities);
      const unlockedNow = [];

      const rules = [
        {
          id: 'vocab_master',
          cond: doneKeys.some(k => k.startsWith('world1:')) || state.xp >= 60
        },
        {
          id: 'grammar_explorer',
          cond: doneKeys.some(k => k.startsWith('world2:')) || doneKeys.some(k => k.startsWith('characters:'))
        },
        {
          id: 'past_hero',
          cond: doneKeys.some(k => k.startsWith('world3:'))
        },
        {
          id: 'speaking_star',
          cond: doneKeys.some(k => k.startsWith('world4:'))
        },
        {
          id: 'exam_champion',
          cond: doneKeys.some(k => k.startsWith('world5:')) || state.examHistory.length > 0
        }
      ];

      rules.forEach(rule => {
        if (rule.cond && !state.badges.includes(rule.id)) {
          state.badges.push(rule.id);
          const meta = BADGES_CATALOG.find(b => b.id === rule.id);
          if (meta) unlockedNow.push(meta);
        }
      });

      if (unlockedNow.length > 0) {
        SoundFX.fanfare();
        unlockedNow.forEach(b => {
          showToast(
            `🏅 ¡Nueva insignia: ${b.name}!`,
            `${b.esDesc} — Great job!`,
            'border-amber-400/60 text-amber-200'
          );
        });
      }
    }

    function awardReward({ xp = 0, stars = 0, coins = 0, activityKey = null, reasonEs = '' }) {
      state.xp += xp;
      state.stars += stars;
      state.coins += coins;

      let firstTimeBonus = false;
      if (activityKey && !state.completedActivities[activityKey]) {
        state.completedActivities[activityKey] = true;
        state.stars += 1;
        state.coins += 10;
        firstTimeBonus = true;
      }

      checkAndUnlockBadges();
      saveState();
      updateTopHUD();

      if (reasonEs) {
        const extra = firstTimeBonus ? ' +1 ★ de misión completada!' : '';
        showToast(
          `+${xp} XP · +${stars + (firstTimeBonus ? 1 : 0)} ★`,
          `${reasonEs}${extra}`,
          'border-teal-400/50 text-teal-200'
        );
      }
    }

    function updateTopHUD() {
      const xpEl = document.getElementById('hud-top-xp');
      const starsEl = document.getElementById('hud-top-stars');
      const coinsEl = document.getElementById('hud-top-coins');
      if (xpEl) xpEl.textContent = `${state.xp} XP`;
      if (starsEl) starsEl.textContent = `${state.stars} ★`;
      if (coinsEl) coinsEl.textContent = `${state.coins} 🪙`;

      const pct = computeProgressPercent();
      const homeXp = document.getElementById('hud-home-xp');
      const homeStars = document.getElementById('hud-home-stars');
      const homeProgress = document.getElementById('hud-home-progress');
      const homeBar = document.getElementById('hud-home-bar');
      if (homeXp) homeXp.textContent = String(state.xp);
      if (homeStars) homeStars.textContent = String(state.stars);
      if (homeProgress) homeProgress.textContent = `${pct}%`;
      if (homeBar) homeBar.style.width = `${pct}%`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* =========================================================================
       4. PERSONAJE GUÍA QUESTY (SVG ILUSTRADO)
       ========================================================================= */
    function renderQuesty(messageEs, moodTag = 'QUESTY · A1 GUIDE') {
      return `
        <div class="rpg-panel rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center gap-4 shadow-glow-blue">
          <div class="animate-float shrink-0 w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500/25 via-violet-500/25 to-teal-400/25 border border-sky-400/40 flex items-center justify-center">
            <!-- Ilustración SVG de QUESTY -->
            <svg class="w-16 h-16" viewBox="0 0 80 80" fill="none">
              <circle cx="40" cy="44" r="22" fill="#13224A" stroke="#38BDF8" stroke-width="2.6"/>
              <!-- Antena / cristal guía -->
              <line x1="40" y1="22" x2="40" y2="11" stroke="#FACC15" stroke-width="2.6" stroke-linecap="round"/>
              <circle cx="40" cy="9" r="4.5" fill="#FACC15"/>

              <!-- Bufanda / insignia RPG -->
              <path d="M24 62L40 68L56 62" stroke="#A855F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="flex-1 text-center sm:text-left">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider bg-sky-500/15 text-sky-300 border border-sky-400/30 mb-1.5">
              <span>✦</span>
              <span>${escapeHtml(moodTag)}</span>

    /* =========================================================================
       5. NAVEGACIÓN ENTRE VISTAS (HOME, MAP, PRACTICE, PROGRESS, WORLD)
       ========================================================================= */
    function clearTimers() {
      if (speakingIntervalId) {
        clearInterval(speakingIntervalId);
        speakingIntervalId = null;
      }
      if (examIntervalId) {
        clearInterval(examIntervalId);
        examIntervalId = null;
      }
      runtimeUI.speakingTimerRunning = false;
      runtimeUI.examTimerActive = false;
    }

    function navigateTo(view, worldId = null, stepKey = null) {
      SoundFX.click();
      clearTimers();
      state.activeView = view;
      if (worldId) {
        state.activeWorldId = worldId;
        initWorldState(worldId);
      }
      if (stepKey) {
        state.activeStep = stepKey;
      }
      saveState();
      syncNavHighlights();
      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function initWorldState(worldId) {
      if (worldId === 'world1') {
        runtimeUI.flashcardIndex = 0;
        runtimeUI.flashcardRevealed = false;
        runtimeUI.matchSelectedEn = null;
        runtimeUI.matchSelectedEs = null;
        runtimeUI.matchMatchedIds = [];
        runtimeUI.quizQuestions = buildVocabQuiz10();
        runtimeUI.quizIndex = 0;
        runtimeUI.quizScore = 0;
        runtimeUI.quizAnswered = false;
        runtimeUI.quizSelectedOption = null;
      } else if (worldId === 'world2') {
        runtimeUI.orderIndex = 0;
        runtimeUI.orderCurrent = [];
      } else if (worldId === 'world3') {
        runtimeUI.pastFlashIndex = 0;
        runtimeUI.pastFlashRevealed = false;
        runtimeUI.pastMatchSelectedBase = null;
        runtimeUI.pastMatchSelectedPast = null;
        runtimeUI.pastMatchPairs = [];
        setupMemoryGame();
      } else if (worldId === 'world4') {
        runtimeUI.speakingIndex = 0;
        runtimeUI.speakingShowAnswer = false;
        runtimeUI.speakingTimer = 10;
        runtimeUI.speakingPool = runtimeUI.speakingRandomMode
          ? shuffleArray(ALL_SPEAKING_QUESTIONS)
          : ALL_SPEAKING_QUESTIONS;
      } else if (worldId === 'world5') {
        runtimeUI.examPhase = 'intro';
        runtimeUI.examIndex = 0;
        runtimeUI.examLogs = [];
        runtimeUI.examSpeakingStarted = false;
        runtimeUI.examShowModel = false;
        runtimeUI.examTimer = 10;
      }
    }

    function syncNavHighlights() {
      const current = state.activeView === 'world' ? 'map' : state.activeView;
      document.querySelectorAll('.nav-pill').forEach(btn => {
        const active = btn.getAttribute('data-nav') === current;
        btn.className = active
          ? 'nav-pill px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-gradient-to-r from-blue-500 to-violet-500 text-white shadow-sm'
          : 'nav-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 text-slate-300 hover:text-white hover:bg-slate-800/70';
      });
      document.querySelectorAll('.nav-pill-mobile').forEach(btn => {
        const active = btn.getAttribute('data-nav') === current;
        btn.className = active
          ? 'nav-pill-mobile flex flex-col items-center justify-center py-1.5 px-3 rounded-xl text-[11px] font-bold transition bg-blue-500/20 text-sky-300 border border-sky-400/30'
          : 'nav-pill-mobile flex flex-col items-center justify-center py-1.5 px-3 rounded-xl text-[11px] font-semibold transition text-slate-400 hover:text-slate-200';
      });
    }

    function renderView() {
      const main = document.getElementById('main-content');
      if (!main) return;
      updateTopHUD();

      if (state.activeView === 'home') {
        main.innerHTML = renderHomeScreen();
        bindHomeEvents();
      } else if (state.activeView === 'map') {
        main.innerHTML = renderMapScreen();
        bindMapEvents();
      } else if (state.activeView === 'practice') {
        main.innerHTML = renderPracticeScreen();
        bindPracticeEvents();
      } else if (state.activeView === 'progress') {
        main.innerHTML = renderProgressScreen();
        bindProgressEvents();
      } else if (state.activeView === 'world') {
        main.innerHTML = renderWorldScreen(state.activeWorldId, state.activeStep);
        bindWorldEvents(state.activeWorldId, state.activeStep);
      }
    }

        backBtn.addEventListener('click', () => navigateTo('map'));
      }

      document.querySelectorAll('[data-step-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          const nextStep = btn.getAttribute('data-step-tab');
          navigateTo('world', worldId, nextStep);
        });
      });

      bindStepInteractiveEvents(worldId, stepKey);
    }

    function renderStepContent(worldId, stepKey) {
      if (worldId === 'world1') return renderWorld1Step(stepKey);
      if (worldId === 'world2') return renderWorld2Step(stepKey);
      if (worldId === 'world3') return renderWorld3Step(stepKey);
      if (worldId === 'world4') return renderWorld4Step(stepKey);
      if (worldId === 'world5') return renderWorld5Step(stepKey);
      if (worldId === 'characters') return renderCharactersStep(stepKey);
      return '';
    }

    function bindStepInteractiveEvents(worldId, stepKey) {
      if (worldId === 'world1') bindWorld1Events(stepKey);
      else if (worldId === 'world2') bindWorld2Events(stepKey);
      else if (worldId === 'world3') bindWorld3Events(stepKey);
      else if (worldId === 'world4') bindWorld4Events(stepKey);
      else if (worldId === 'world5') bindWorld5Events(stepKey);
      else if (worldId === 'characters') bindCharactersEvents(stepKey);
    }

    function buildVocabQuiz10() {
      const pool = shuffleArray(VOCAB_VERBS);
      const questions = [];
      for (let i = 0; i < 10; i++) {
        const item = pool[i % pool.length];
        const distractors = shuffleArray(VOCAB_VERBS.filter(v => v.id !== item.id)).slice(0, 3);
        const mode = i % 3;
        if (mode === 0) {
          questions.push({
            verbId: item.id,
            prompt: `¿Qué verbo en inglés representa esta imagen y significa "${item.es}"?`,
            options: shuffleArray([item.verb, ...distractors.map(d => d.verb)]),
            answer: item.verb,
            esExplain: `${item.verb} significa "${item.es}" (${item.example}).`
          });
        } else if (mode === 1) {
          questions.push({
            verbId: item.id,
            prompt: `¿Cuál es la traducción al español del verbo "${item.verb}"?`,
            options: shuffleArray([item.es, ...distractors.map(d => d.es)]),
            answer: item.es,
            esExplain: `"${item.verb}" se traduce como "${item.es}".`
          });
        } else {
          questions.push({
            verbId: item.id,
            prompt: `Completa con el verbo correcto según el contexto: "${item.example.replace(new RegExp(item.verb, 'i'), '_____')}"`,
            options: shuffleArray([item.verb, ...distractors.map(d => d.verb)]),
            answer: item.verb,
            esExplain: `La oración correcta es "${item.example}".`
          });
        }
      }
      return questions;
    }

    function evaluateW1Match() {
      const fb = document.getElementById('w1-match-feedback');
      if (!runtimeUI.matchSelectedEn || !runtimeUI.matchSelectedEs) {
        renderWorld1MatchBoard();
        return;
      }
      if (runtimeUI.matchSelectedEn === runtimeUI.matchSelectedEs) {
        const id = runtimeUI.matchSelectedEn;
        if (!runtimeUI.matchMatchedIds.includes(id)) {
          runtimeUI.matchMatchedIds.push(id);
        }
        runtimeUI.matchSelectedEn = null;
        runtimeUI.matchSelectedEs = null;
        SoundFX.correct();
        const allDone = runtimeUI.matchMatchedIds.length === 6;
        awardReward({
          xp: 10,
          stars: allDone ? 1 : 0,
          coins: 5,
          activityKey: allDone ? 'world1:match' : null,
          reasonEs: allDone ? '¡Emparejaste todos los pares!' : '¡Par correcto!'
        });
        if (fb) {
          fb.innerHTML = `<span class="text-emerald-300">Correct! ¡Excelente conexión! (${runtimeUI.matchMatchedIds.length}/6)</span>`;
        }
      } else {
        SoundFX.wrong();
        if (fb) {
          fb.innerHTML = `<span class="text-rose-300">Try again! Ese par en inglés y español no coincide.</span>`;
        }
        runtimeUI.matchSelectedEn = null;
        runtimeUI.matchSelectedEs = null;
      }
      renderWorld1MatchBoard();
    }

    function bindWorld2Events(stepKey) {
      document.querySelectorAll('[data-next-step]').forEach(btn => {
        btn.addEventListener('click', () => navigateTo('world', 'world2', btn.getAttribute('data-next-step')));
      });

      if (stepKey === 'PRACTICE') {
        document.querySelectorAll('[data-w2-classify]').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = btn.getAttribute('data-w2-classify');
            const ans = btn.getAttribute('data-w2-classify-ans');
            const fb = document.getElementById('w2-classify-fb');
            if (chosen === ans) {
              SoundFX.correct();
              awardReward({ xp: 15, stars: 1, coins: 5, activityKey: 'world2:classify', reasonEs: '¡Clasificaste el tiempo verbal correctamente!' });
              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! Es <strong>${escapeHtml(ans)}</strong> porque "went" indica pasado.</span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Fíjate en el verbo "went" y el contexto de pasado.</span>`;
            }
          });
        });

        document.querySelectorAll('[data-w2-struct]').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = btn.getAttribute('data-w2-struct');
            const ans = btn.getAttribute('data-w2-struct-ans');
            const fb = document.getElementById('w2-struct-fb');
            if (chosen === ans) {
              SoundFX.correct();
              awardReward({ xp: 15, coins: 5, activityKey: 'world2:structure', reasonEs: '¡Estructura correcta!' });
              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! ${escapeHtml(TIME_STRUCTURE_QUESTIONS[0].es)}</span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Recuerda la regla para NOW (Present Continuous).</span>`;
            }
          });
        });
      }

      if (stepKey === 'REMEMBER') {
        document.querySelectorAll('[data-w2-comp]').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = btn.getAttribute('data-w2-comp');
            const ans = btn.getAttribute('data-w2-comp-ans');
            const fb = document.getElementById('w2-comp-fb');
            if (chosen === ans) {
              SoundFX.correct();
              awardReward({ xp: 15, stars: 1, coins: 5, activityKey: 'world2:complete', reasonEs: '¡Oración completada!' });
              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! ${escapeHtml(TIME_COMPLETE_ITEMS[0].es)}</span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Revisa el marcador de tiempo ("Yesterday").</span>`;
            }
          });
        });
      }

      if (stepKey === 'SPEAK') {
        const resetBtn = document.getElementById('w2-order-reset');
        const nextBtn = document.getElementById('w2-order-next');
        const checkBtn = document.getElementById('w2-order-check');
        const inputEl = document.getElementById('w2-order-input');

        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            SoundFX.click();
            const obj = TIME_ORDER_ITEMS[runtimeUI.orderIndex % TIME_ORDER_ITEMS.length];
            runtimeUI.orderCurrent = shuffleArray(obj.words);
            renderView();
          });
        }

        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            SoundFX.click();
            runtimeUI.orderIndex += 1;
            const obj = TIME_ORDER_ITEMS[runtimeUI.orderIndex % TIME_ORDER_ITEMS.length];
            runtimeUI.orderCurrent = shuffleArray(obj.words);
            renderView();
          });
        }

        if (checkBtn && inputEl) {
          checkBtn.addEventListener('click', () => {
            const obj = TIME_ORDER_ITEMS[runtimeUI.orderIndex % TIME_ORDER_ITEMS.length];
            const cleanUser = inputEl.value.trim().replace(/\s+/g, ' ').replace(/[.!?]+$/, '').toLowerCase();
            const cleanTarget = obj.correct.replace(/[.!?]+$/, '').toLowerCase();
            const fb = document.getElementById('w2-order-fb');
            if (cleanUser === cleanTarget) {
              SoundFX.correct();
              awardReward({ xp: 20, stars: 1, coins: 8, activityKey: 'world2:order', reasonEs: '¡Ordenaste la oración perfectamente!' });
              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! Modelo: <strong>${escapeHtml(obj.correct)}</strong></span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Modelo esperado: <strong>${escapeHtml(obj.correct)}</strong></span>`;
            }
          });
        }
      }

      if (stepKey === 'CHALLENGE') {
        document.querySelectorAll('[data-w2-err]').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = btn.getAttribute('data-w2-err');

              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! ${escapeHtml(TIME_ERROR_ITEMS[0].es)}</span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Observa qué tiempo verbal indica la oración.</span>`;
            }
          });
        });
      }
    }

    function setupMemoryGame() {
      const pick6 = shuffleArray(PAST_VERBS).slice(0, 6);

        cards.push({ uid: `${idx}-base`, pairId: idx, label: item.base, kind: 'BASE' });
        cards.push({ uid: `${idx}-past`, pairId: idx, label: item.past, kind: 'PAST' });
      });
      runtimeUI.memoryCards = shuffleArray(cards);
      runtimeUI.memoryFlipped = [];
      runtimeUI.memoryMatched = [];
    }

    function buildAlternatingExamSet(totalQuestions = 6) {
      const ynPool = shuffleArray(YES_NO_QUESTIONS);
      const whPool = shuffleArray(WH_QUESTIONS);
      const set = [];
      for (let i = 0; i < totalQuestions; i++) {
        if (i % 2 === 0) {
          set.push(ynPool[Math.floor(i / 2) % ynPool.length]);
        } else {
          set.push(whPool[Math.floor(i / 2) % whPool.length]);
        }
      }
      return set;
    }

            </ul>
            <div class="pt-2">
              <button data-next-step="CHALLENGE" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-extrabold text-xs">
                Ir a Simulación Final Boss →
              </button>
            </div>
          </div>
        `;
      }

      if (runtimeUI.examPhase === 'intro') {
        return `
          <div class="rpg-panel rounded-2xl p-6 text-center space-y-4 border border-amber-400/35">
            <div class="text-4xl">👑⚔️</div>
            <h2 class="font-display text-2xl font-extrabold text-white">FINAL BOSS: ORAL EXAM SIMULATION</h2>
            <p class="text-sm text-slate-300 max-w-xl mx-auto">
              Responderás 6 preguntas alternadas (YES/NO y WH-QUESTIONS). Tendrás <strong>10 segundos</strong> para pensar cada pregunta, podrás hablar en voz alta y luego autoevaluarte.
            </p>
            <button
              id="w5-start-exam-btn"
              type="button"
              class="px-7 py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 hover:brightness-110 text-slate-950 font-display font-extrabold text-sm shadow-glow-gold transition"
            >
              Comenzar Examen Oral
            </button>
          </div>
        `;
      }

      if (runtimeUI.examPhase === 'report') {
        const total = runtimeUI.examLogs.length || 1;
        const correctCount = runtimeUI.examLogs.filter(x => x.correct).length;
        const fullSentCount = runtimeUI.examLogs.filter(x => x.fullSentence).length;
        const structCount = runtimeUI.examLogs.filter(x => x.structureOk).length;

        return `
          <div class="rpg-panel rounded-2xl p-6 space-y-5 border border-teal-400/40">
            <div class="text-center space-y-1.5">
              <div class="text-3xl">🏅</div>
              <h2 class="font-display text-2xl font-extrabold text-white">Informe Final de Desempeño Oral</h2>
              <p class="text-xs text-slate-400">
                Nota: esta autoevaluación refleja tu práctica oral individual (no mide pronunciación acústica de audio).
              </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
              <div class="rounded-2xl bg-[#090F22] border border-slate-800 p-4">
                <div class="text-xs text-slate-400">Respuestas Correctas</div>
                <div class="font-display font-extrabold text-2xl text-emerald-300 mt-1">${correctCount} / ${total}</div>
              </div>
              <div class="rounded-2xl bg-[#090F22] border border-slate-800 p-4">
                <div class="text-xs text-slate-400">Oración Completa</div>
                <div class="font-display font-extrabold text-2xl text-sky-300 mt-1">${fullSentCount} / ${total}</div>
              </div>
              <div class="rounded-2xl bg-[#090F22] border border-slate-800 p-4">
                <div class="text-xs text-slate-400">Estructura Correcta</div>
                <div class="font-display font-extrabold text-2xl text-amber-300 mt-1">${structCount} / ${total}</div>
              </div>
            </div>

            <div class="rounded-2xl bg-[#090F22] border border-slate-800 p-4 space-y-2 text-xs sm:text-sm text-slate-200">
              <p><strong class="text-teal-300">Fortalezas y consejo en español:</strong> ${
                fullSentCount === total
                  ? '¡Excelente! Mantuviste oraciones completas en todas las preguntas. Sigue practicando la fluidez en pasado.'
                  : 'Buen avance. Procura responder siempre con oración completa (por ejemplo: "Yes, I did. I studied English yesterday." o "I went to the mall.") en vez de responder solo una palabra.'
              }</p>
            </div>

            <div class="flex flex-wrap justify-center gap-3">
              <button id="w5-retry-exam-btn" type="button" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-extrabold text-xs">
                Repetir Examen Oral
              </button>
              <button id="w5-to-progress-btn" type="button" class="px-5 py-3 rounded-xl bg-[#131D3E] hover:bg-[#1C2B5C] border border-sky-400/30 text-sky-200 font-bold text-xs">
                Ver Insignias y Progreso →
              </button>
            </div>
          </div>
        `;
      }

      // Fase 'question': una pregunta a la vez, sin traducciones automáticas ni pistas iniciales
      const currentQ = runtimeUI.examQuestions[runtimeUI.examIndex];
      const isYN = currentQ.category === 'YES / NO';

      return `
        <div class="rpg-panel rounded-2xl p-5 sm:p-6 space-y-5 border border-amber-400/30">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="px-3 py-1 rounded-full bg-amber-500/15 border border-amber-400/35 text-amber-200 text-xs font-bold">
              Pregunta ${runtimeUI.examIndex + 1} de ${runtimeUI.examQuestions.length} · ${escapeHtml(currentQ.category)}
            </span>
            <span id="w5-timer-display" class="px-3 py-1 rounded-full bg-sky-500/15 border border-sky-400/35 text-sky-200 text-xs font-bold">
              ${runtimeUI.examTimer}s para pensar
            </span>
          </div>

          <div class="rounded-2xl bg-[#090F22] border border-slate-800 p-6 space-y-5">
            <h2 class="font-display text-2xl sm:text-3xl font-extrabold text-white">
              ${escapeHtml(currentQ.question)}
            </h2>

            <div class="flex flex-wrap items-center gap-3">
              <button
                id="w5-start-speaking-btn"
                type="button"
                class="px-5 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-violet-500 hover:brightness-110 text-white font-display font-bold text-xs transition"
              >
                🎙️ START SPEAKING
              </button>
              <button
                id="w5-show-model-btn"
                type="button"
                class="px-5 py-3 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold text-xs transition"
              >
                SHOW MODEL ANSWER
              </button>
            </div>

            ${runtimeUI.examSpeakingStarted ? `
              <div class="rounded-xl bg-blue-500/10 border border-blue-400/35 p-3.5 text-xs sm:text-sm text-sky-200">
                <strong>Hablando en voz alta (autopráctica):</strong> di tu respuesta completa en inglés ahora y luego revisa la respuesta modelo y autoevalúate.
              </div>
            ` : ''}

            ${runtimeUI.examShowModel ? `
              <div class="rounded-2xl bg-[#121D3E] border border-teal-400/40 p-4 space-y-2 animate-fade-up">
                <div class="text-xs font-bold uppercase text-teal-300">Respuesta Modelo</div>
                ${isYN ? `
                  <p class="text-sm text-emerald-300 font-semibold">YES: "${escapeHtml(currentQ.modelYes)}"</p>
                  <p class="text-sm text-amber-300 font-semibold">NO: "${escapeHtml(currentQ.modelNo)}"</p>
                ` : `
                  <p class="text-sm text-emerald-300 font-semibold">"${escapeHtml(currentQ.modelAnswer)}"</p>
                `}
                <p class="text-xs text-slate-300 pt-1">${escapeHtml(currentQ.esHint)}</p>
              </div>
            ` : ''}

            <!-- Autoevaluación de la estudiante -->
            <div class="pt-4 border-t border-slate-800 space-y-3">
              <div class="text-xs font-bold uppercase text-amber-300">Autoevaluación de tu respuesta:</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                <label class="flex items-center gap-2 rounded-xl bg-[#111B38] border border-slate-700 p-3 cursor-pointer">
                  <input id="w5-chk-correct" type="checkbox" checked class="rounded accent-emerald-400" />
                  <span>Respondí correctamente</span>
                </label>
                <label class="flex items-center gap-2 rounded-xl bg-[#111B38] border border-slate-700 p-3 cursor-pointer">
                  <input id="w5-chk-full" type="checkbox" checked class="rounded accent-sky-400" />
                  <span>Usé oración completa</span>
                </label>
                <label class="flex items-center gap-2 rounded-xl bg-[#111B38] border border-slate-700 p-3 cursor-pointer">
                  <input id="w5-chk-struct" type="checkbox" checked class="rounded accent-amber-400" />
                  <span>Estructura correcta</span>
                </label>
              </div>

              <div class="flex justify-end pt-1">
                <button
                  id="w5-submit-self-eval-btn"
                  type="button"
                  class="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition"
                >
                  ${runtimeUI.examIndex + 1 === runtimeUI.examQuestions.length ? 'Guardar y Ver Informe Final →' : 'Guardar y Siguiente Pregunta →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function bindWorld5Events(stepKey) {
      document.querySelectorAll('[data-next-step]').forEach(btn => {
        btn.addEventListener('click', () => navigateTo('world', 'world5', btn.getAttribute('data-next-step')));
      });

      const startBtn = document.getElementById('w5-start-exam-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          SoundFX.click();
          runtimeUI.examQuestions = buildAlternatingExamSet(6);
          runtimeUI.examIndex = 0;
          runtimeUI.examLogs = [];
          runtimeUI.examPhase = 'question';
          runtimeUI.examSpeakingStarted = false;
          runtimeUI.examShowModel = false;
          renderView();
          startExam10sTimer();
        });
      }

      const speakBtn = document.getElementById('w5-start-speaking-btn');
      if (speakBtn) {
        speakBtn.addEventListener('click', () => {
          SoundFX.click();
          runtimeUI.examSpeakingStarted = true;
          renderView();
        });
      }

      const showModelBtn = document.getElementById('w5-show-model-btn');
      if (showModelBtn) {
        showModelBtn.addEventListener('click', () => {
          SoundFX.click();
          runtimeUI.examShowModel = !runtimeUI.examShowModel;
          renderView();
        });
      }

      const evalBtn = document.getElementById('w5-submit-self-eval-btn');
      if (evalBtn) {
        evalBtn.addEventListener('click', () => {
          const cCorrect = Boolean(document.getElementById('w5-chk-correct')?.checked);
          const cFull = Boolean(document.getElementById('w5-chk-full')?.checked);
          const cStruct = Boolean(document.getElementById('w5-chk-struct')?.checked);
          const q = runtimeUI.examQuestions[runtimeUI.examIndex];

          runtimeUI.examLogs.push({
            question: q.question,
            correct: cCorrect,
            fullSentence: cFull,
            structureOk: cStruct
          });

          const earnedXp = (cCorrect ? 10 : 0) + (cFull ? 5 : 0) + (cStruct ? 5 : 0);
          if (earnedXp > 0) {
            SoundFX.correct();
            awardReward({ xp: earnedXp, coins: 5 });
          } else {
            SoundFX.click();
          }

          clearTimers();
          if (runtimeUI.examIndex + 1 < runtimeUI.examQuestions.length) {
            runtimeUI.examIndex += 1;
            runtimeUI.examSpeakingStarted = false;
            runtimeUI.examShowModel = false;
            renderView();
            startExam10sTimer();
          } else {
            const total = runtimeUI.examLogs.length;
            const score = runtimeUI.examLogs.filter(x => x.correct).length;
            const fulls = runtimeUI.examLogs.filter(x => x.fullSentence).length;
            state.examHistory.push({
              dateLabel: new Date().toLocaleDateString('es-CL'),
              scoreLabel: `${score}/${total}`,
              fullSentenceCount: fulls,
              total
            });
            awardReward({
              xp: 35,
              stars: 2,
              coins: 20,
              activityKey: 'world5:exam_completed',
              reasonEs: '¡Completaste la simulación Final Boss: Oral Exam!'
            });
            runtimeUI.examPhase = 'report';
            renderView();
          }
        });
      }

      const retryExam = document.getElementById('w5-retry-exam-btn');
      if (retryExam) {
        retryExam.addEventListener('click', () => {
          SoundFX.click();
          runtimeUI.examQuestions = buildAlternatingExamSet(6);
          runtimeUI.examIndex = 0;
          runtimeUI.examLogs = [];
          runtimeUI.examPhase = 'question';
          runtimeUI.examSpeakingStarted = false;
          runtimeUI.examShowModel = false;
          renderView();
          startExam10sTimer();
        });
      }

      const toProg = document.getElementById('w5-to-progress-btn');
      if (toProg) {
        toProg.addEventListener('click', () => navigateTo('progress'));
      }
    }

    /* =========================================================================
       14. SPECIAL CONTENT: CHARACTER CHALLENGE (THOMAS, JACKSON, JENNY KIM)
       ========================================================================= */
    function renderCharactersStep(stepKey) {
      if (stepKey === 'LEARN') {
        return `
          <div class="rpg-panel rounded-2xl p-5 sm:p-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="font-display text-xl sm:text-2xl font-bold text-white">🧩 Special Mission – Character Challenge</h2>
                <p class="text-sm text-slate-300 mt-1">
                  Estudia las fichas exactas de <strong>THOMAS</strong>, <strong>JACKSON</strong> y <strong>JENNY KIM</strong> en pasado (Yesterday), rutina y ahora (Now).
                </p>
              </div>
              <button data-next-step="CHALLENGE" class="px-4 py-2 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-extrabold text-xs">
                Ir a Desafíos de Personajes →
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
              ${CHARACTERS.map(ch => `
                <div class="rounded-2xl bg-[#090F22] border ${ch.border} p-4 space-y-3">
                  <div>
                    <h3 class="font-display font-extrabold text-lg ${ch.accent}">${escapeHtml(ch.name)}</h3>
                    <p class="text-xs text-slate-400">${escapeHtml(ch.role)}</p>
                  </div>
                  <div class="space-y-2 text-xs text-slate-200">
                    <div class="rounded-xl bg-[#111B38] p-2.5">
                      <span class="font-bold text-amber-300">Yesterday:</span>
                      <p class="mt-0.5">${escapeHtml(ch.yesterday.join('; '))}</p>
                    </div>
                    <div class="rounded-xl bg-[#111B38] p-2.5">
                      <span class="font-bold text-sky-300">${escapeHtml(ch.routineLabel)}:</span>
                      <p class="mt-0.5">${escapeHtml(ch.routineItems.join('; '))}</p>
                    </div>
                    <div class="rounded-xl bg-[#111B38] p-2.5">
                      <span class="font-bold text-teal-300">Now:</span>
                      <p class="mt-0.5">${escapeHtml(ch.nowItems.join('; '))}</p>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // CHALLENGE (y demás pasos): desafíos interactivos sobre los personajes
      const chQ = CHARACTER_CHALLENGES[0];
      return `
        <div class="rpg-panel rounded-2xl p-5 sm:p-6 space-y-4">
          <div>
            <span class="text-xs font-bold uppercase text-cyan-300">${escapeHtml(chQ.character)} · ${escapeHtml(chQ.timeframe)}</span>
            <h2 class="font-display text-xl font-bold text-white">${escapeHtml(chQ.prompt)}</h2>
          </div>

          <div class="grid grid-cols-1 gap-2.5">
            ${shuffleArray(chQ.options).map(opt => `
              <button
                type="button"
                data-ch-opt="${escapeHtml(opt)}"
                data-ch-ans="${escapeHtml(chQ.answer)}"
                class="p-3.5 rounded-xl bg-[#090F22] hover:bg-cyan-500/15 border border-slate-700 hover:border-cyan-400 text-left text-xs sm:text-sm font-semibold text-white transition"
              >
                ${escapeHtml(opt)}
              </button>
            `).join('')}
          </div>
          <div id="ch-feedback" class="text-xs sm:text-sm font-semibold"></div>
        </div>
      `;
    }

    function bindCharactersEvents(stepKey) {
      document.querySelectorAll('[data-next-step]').forEach(btn => {
        btn.addEventListener('click', () => navigateTo('world', 'characters', btn.getAttribute('data-next-step')));
      });

      if (stepKey !== 'LEARN') {
        document.querySelectorAll('[data-ch-opt]').forEach(btn => {
          btn.addEventListener('click', () => {
            const chosen = btn.getAttribute('data-ch-opt');
            const ans = btn.getAttribute('data-ch-ans');
            const fb = document.getElementById('ch-feedback');
            if (chosen === ans) {
              SoundFX.correct();
              awardReward({
                xp: 20,
                stars: 1,
                coins: 10,
                activityKey: 'characters:challenge',
                reasonEs: '¡Interpretaste la ficha del personaje correctamente!'
              });
              if (fb) fb.innerHTML = `<span class="text-emerald-300">Correct! ${escapeHtml(CHARACTER_CHALLENGES[0].es)}</span>`;
            } else {
              SoundFX.wrong();
              if (fb) fb.innerHTML = `<span class="text-rose-300">Try again! Revisa los datos de THOMAS en "Yesterday".</span>`;
            }
          });
        });
      }
    }

    /* =========================================================================
       15. INICIALIZACIÓN GLOBAL DE LA APLICACIÓN
       ========================================================================= */
    function initApp() {
      const brandBtn = document.getElementById('brand-home-btn');
      if (brandBtn) {
        brandBtn.addEventListener('click', () => navigateTo('home'));
      }

      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetView = btn.getAttribute('data-nav');
          navigateTo(targetView);
        });
      });

      const soundBtn = document.getElementById('sound-toggle-btn');
      const iconOn = document.getElementById('sound-icon-on');
      const iconOff = document.getElementById('sound-icon-off');
      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          const next = !SoundFX.isEnabled();
          SoundFX.setEnabled(next);
          if (iconOn && iconOff) {
            iconOn.classList.toggle('hidden', !next);
            iconOff.classList.toggle('hidden', next);
          }
          if (next) SoundFX.click();
        });
      }

      runtimeUI.quizQuestions = buildVocabQuiz10();
      setupMemoryGame();
      syncNavHighlights();
      renderView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
